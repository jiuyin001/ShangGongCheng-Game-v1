<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>垃圾分类小达人 · 新 UI 预览</title>
<style>
  :root{--bg:#FFF6E5;--card:#fff;--ink:#3A2A16;--accent:#FF7A1A;}
  *{box-sizing:border-box}
  body{margin:0;padding:28px;background:linear-gradient(160deg,#FFF6E5,#FFE3C4);
       font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);}
  h1{font-size:26px;text-align:center;margin:0 0 6px;}
  .sub{text-align:center;color:#8A6B4F;font-weight:700;margin-bottom:22px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;max-width:1200px;margin:0 auto;}
  .shot{background:var(--card);border:4px solid #fff;border-radius:22px;overflow:hidden;
        box-shadow:0 8px 0 rgba(0,0,0,.08),0 16px 34px rgba(255,120,30,.18);}
  .shot img{display:block;width:100%;height:auto;}
  .cap{padding:10px 14px;font-weight:800;color:#8F3E08;background:#FFF1E0;border-top:3px solid #FFE0C0;}
  .note{max-width:1200px;margin:22px auto 0;padding:16px 20px;background:#fff;border-radius:18px;
        box-shadow:0 6px 0 rgba(0,0,0,.06);font-size:14px;line-height:1.7;}
</style>
</head>
<body>
  <h1>垃圾分类小达人 · 新 UI 预览</h1>
  <div class="sub">乱涂彩世界涂鸦风格 · 本页为 headless Chromium 真实渲染截图</div>
  <div class="grid">
    <div class="shot"><img src="00_boot_loading.png" alt="开局加载页"><div class="cap">① 开局加载页</div></div>
    <div class="shot"><img src="01_home_splash.png" alt="首页封面"><div class="cap">② 首页封面（splash）</div></div>
    <div class="shot"><img src="02_home_arena.png" alt="首页主区"><div class="cap">③ 首页主区（选模式）</div></div>
    <div class="shot"><img src="10_classic.png" alt="垃圾分类小达人"><div class="cap">④ 垃圾分类小达人</div></div>
    <div class="shot"><img src="10_flychess.png" alt="垃圾分类飞行棋"><div class="cap">⑤ 垃圾分类飞行棋</div></div>
    <div class="shot"><img src="10_runner.png" alt="垃圾分类跑酷"><div class="cap">⑥ 垃圾分类跑酷</div></div>
    <div class="shot"><img src="10_matches.png" alt="垃圾消消乐"><div class="cap">⑦ 垃圾消消乐</div></div>
    <div class="shot"><img src="20_learn.png" alt="垃圾分类小课堂"><div class="cap">⑧ 垃圾分类小课堂</div></div>
  </div>
  <div class="note">
    <b>说明：</b>以上为项目在本地 HTTP 环境下用无头 Chromium 实际渲染的截图（非示意图）。
    新风格由样式表末尾的「R62 乱涂彩世界风格覆盖层」+ R70–R73 补丁实现：高饱和糖果配色、大圆角、
    厚投影、明确按压态。四分类官方标识图引用保持不变。
  </div>
</body>
</html>
