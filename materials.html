<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>25种垃圾素材 · 上海分类图鉴</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9e9;color:#2c5142;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:auto;padding:40px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}a,button{color:inherit;text-decoration:none;border:2px solid #c8dfcd;border-radius:14px;background:#fffef8;padding:11px 17px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}a:hover,button:hover{transform:translateY(-2px)}h1{font-size:38px;letter-spacing:-1px;margin:25px 0 15px}p{color:#80977e;font-size:13px;line-height:1.9}.tag{display:inline-block;padding:8px 14px;background:#9cefc7;border-radius:30px;font-size:11px;font-weight:900}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:30px 0}button.active{background:#ffe087;border-color:#d7b254}input{margin-left:auto;border:2px solid #c8dfcd;border-radius:14px;padding:12px 16px;min-width:210px;font:inherit;font-size:12px;color:inherit}section{margin:40px 0}h2{font-size:23px;display:flex;align-items:center;gap:12px}h2:before{content:'';width:16px;height:16px;border-radius:6px;background:var(--cat)}h2 small{font-size:10px;margin-left:auto;color:#9aae8e;font-weight:500}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}article{background:#fffef8;border:3px solid #fff;border-radius:24px;padding:16px;box-shadow:0 5px 0 #3958410b}figure{margin:0;border-radius:17px;background-color:#fffaf0;background-image:conic-gradient(#eef1e8 25%,transparent 0 50%,#eef1e8 0 75%,transparent 0);background-size:20px 20px;height:175px;padding:12px}img{width:100%;height:100%;object-fit:contain}h3{font-size:15px;margin:16px 4px 8px}article p{font-size:11px;margin:0 4px;min-height:45px}code{font-size:9px;color:#a5af99;display:block;margin:12px 4px 0;word-break:break-all}footer{font-size:11px;color:#a1ae92;padding:20px 0}.empty{text-align:center;padding:50px}.source{display:flex;justify-content:space-between;gap:20px;align-items:center;background:#ddf5e7;padding:18px 23px;border-radius:20px;margin-top:25px}.source p{margin:0;font-size:11px}@media(max-width:720px){main{padding:25px 17px}h1{font-size:29px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}figure{height:135px}article{padding:10px}article p{font-size:10px}h3{font-size:13px}input{margin-left:0;width:100%}.source{flex-direction:column;align-items:start}h2{font-size:20px}h2 small{display:none}}
</style><script defer src="content.js"></script><script defer src="trash-data.js"></script><script defer src="core.js"></script></head><body><main><header><span class="tag">GREEN PLAY · ASSET CATALOG</span><a href="hall.html">← 返回游乐园</a></header><h1>每件垃圾，都有自己的家。</h1><p>25种透明背景垃圾素材，每类都有专属分类故事。游戏图案不附带分类色框；课堂与提示卡再显示分类依据。</p><div class="tools" id="tools"><button data-cat="all" class="active">全部25种</button><input id="search" type="search" placeholder="找一种垃圾…" aria-label="搜索垃圾素材"></div><div id="catalog"></div><div class="source"><p>分类依据：你上传的2019年《上海市生活垃圾分类投放指南》。<br>大件、装修垃圾和电子废弃物的专门投放方式，见小课堂。</p><a href="assets/shanghai-guide.jpg" target="_blank" rel="noopener">查看分类原图 ↗</a></div><footer>所有素材保持生成原件：1254 × 1254 PNG，带真实透明通道。</footer></main><script>
document.addEventListener('DOMContentLoaded',()=>{const D=EcoTrash,K=EcoCore;let state;try{state=K.read(localStorage)}catch{state=K.defaults()}const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const t=k=>escape(K.text(k,state.texts));let category='all',search='';const tools=document.getElementById('tools');for(const c of D.categories){const b=document.createElement('button');b.dataset.cat=c.id;b.textContent=K.text('category.'+c.id+'.name',state.texts);tools.insertBefore(b,document.getElementById('search'))}function render(){const html=D.categories.filter(c=>category==='all'||c.id===category).map(c=>{const items=D.forCategory(c.id).filter(i=>(K.text('trash.'+i.id+'.name',state.texts)+i.why).includes(search));return items.length?`<section style="--cat:${c.color}"><h2>${t('category.'+c.id+'.name')}<small>${items.length} 个素材 · 透明PNG</small></h2><div class="grid">${items.map(i=>`<article><figure><img src="${i.image}" alt="${t('trash.'+i.id+'.name')}" loading="lazy"></figure><h3>${t('trash.'+i.id+'.name')}</h3><p>${t('trash.'+i.id+'.why')}</p><code>${i.image}</code></article>`).join('')}</div></section>`:''}).join('');document.getElementById('catalog').innerHTML=html||'<p class="empty">没有找到这个垃圾，换个词试试看。</p>';tools.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.cat===category);b.setAttribute('aria-pressed',b.dataset.cat===category)})}tools.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){category=b.dataset.cat;render()}});document.getElementById('search').addEventListener('input',e=>{search=e.target.value.trim();render()});render()});
</script></body></html>
